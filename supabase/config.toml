# Local Supabase CLI config. Cloud project settings live in the Supabase dashboard.
project_id = "growquest"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:54321"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = false  # local dev only; cloud env requires confirmations

[auth.external.apple]
enabled = false  # enabled in cloud via dashboard, not locally

[edge_runtime]
enabled = true
inspector_port = 8083
