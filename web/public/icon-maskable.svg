<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3461"/>
      <stop offset="55%" stop-color="#b65b3b"/>
      <stop offset="100%" stop-color="#f7c873"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#fff4cc"/>
      <stop offset="45%" stop-color="#ffd76a"/>
      <stop offset="100%" stop-color="#f0a040"/>
    </radialGradient>
  </defs>
  <!-- Full-bleed background (no rounded corners): iOS and Android apply
       their own icon mask, so the source must fill the whole square. -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- Rays -->
  <g stroke="#ffe9a8" stroke-width="11" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="70" x2="256" y2="126"/>
    <line x1="120" y1="182" x2="160" y2="222"/>
    <line x1="392" y1="182" x2="352" y2="222"/>
    <line x1="66" y1="296" x2="122" y2="296"/>
    <line x1="390" y1="296" x2="446" y2="296"/>
    <line x1="146" y1="112" x2="172" y2="150"/>
    <line x1="366" y1="112" x2="340" y2="150"/>
  </g>
  <!-- Sun disc -->
  <circle cx="256" cy="292" r="104" fill="url(#sun)"/>
  <!-- Horizon -->
  <rect x="40" y="392" width="432" height="7" rx="3.5" fill="#fff" opacity="0.38"/>
</svg>
