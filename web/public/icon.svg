<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d3461"/>
      <stop offset="55%" stop-color="#b65b3b"/>
      <stop offset="100%" stop-color="#f7c873"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0%" stop-color="#fff4cc"/>
      <stop offset="45%" stop-color="#ffd76a"/>
      <stop offset="100%" stop-color="#f0a040"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#sky)"/>
  <!-- Rays -->
  <g stroke="#ffe9a8" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="80" x2="256" y2="130"/>
    <line x1="130" y1="186" x2="166" y2="222"/>
    <line x1="382" y1="186" x2="346" y2="222"/>
    <line x1="80" y1="296" x2="130" y2="296"/>
    <line x1="382" y1="296" x2="432" y2="296"/>
    <line x1="155" y1="120" x2="178" y2="155"/>
    <line x1="357" y1="120" x2="334" y2="155"/>
  </g>
  <!-- Sun disc -->
  <circle cx="256" cy="296" r="96" fill="url(#sun)"/>
  <!-- Horizon line -->
  <rect x="56" y="384" width="400" height="6" rx="3" fill="#fff" opacity="0.35"/>
</svg>
