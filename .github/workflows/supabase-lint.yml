name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-lint.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-lint.yml"

concurrency:
  group: supabase-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-on-empty:
    name: db reset against empty Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: growquest_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Stub Supabase auth schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d growquest_test -v ON_ERROR_STOP=1 \
            -f .github/auth-stub.sql

      - name: Apply migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "── applying $f"
            psql -h localhost -U postgres -d growquest_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Smoke test — family bootstrap trigger + approve_mission
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d growquest_test -v ON_ERROR_STOP=1 <<'SQL'
          insert into auth.users (email) values ('ci@example.test');
          do $$
          declare
            uid uuid;
            fid uuid;
            cid uuid;
            mid uuid;
            sid uuid;
            bal bigint;
          begin
            select id into uid from auth.users where email = 'ci@example.test';

            -- Trigger created exactly one family + membership.
            if (select count(*) from public.families where created_by = uid) <> 1 then
              raise exception 'expected exactly one families row';
            end if;
            if (select count(*) from public.family_members where user_id = uid and role = 'parent') <> 1 then
              raise exception 'expected exactly one family_members row with role=parent';
            end if;

            select family_id into fid from public.family_members where user_id = uid;

            -- Set up a child + mission + submission.
            insert into public.child_profiles (family_id, nickname) values (fid, 'Testbarn') returning id into cid;
            insert into public.missions (family_id, title, reward_mynt, recurrence, created_by)
              values (fid, 'Test', 50, 'once', uid) returning id into mid;
            insert into public.mission_submissions (family_id, mission_id, child_id)
              values (fid, mid, cid) returning id into sid;

            -- Simulate the user being authenticated.
            perform set_config('request.jwt.claim.sub', uid::text, true);

            -- Approve via RPC. Should credit ledger.
            perform public.approve_mission(sid, 'approve', null);

            select coalesce(sum(amount_mynt), 0) into bal from public.coin_ledger where child_id = cid;
            if bal <> 50 then
              raise exception 'expected balance=50 after approve, got %', bal;
            end if;

            -- child_balances view reflects the ledger.
            select balance into bal from public.child_balances where child_id = cid;
            if bal <> 50 then
              raise exception 'child_balances view returned %, expected 50', bal;
            end if;

            -- Re-approving the same submission should fail.
            begin
              perform public.approve_mission(sid, 'approve', null);
              raise exception 'expected re-approve to fail';
            exception when others then
              -- expected
              null;
            end;

            -- Set up profile_configs (balanced) and redeem 15 min of screen time.
            insert into public.profile_configs
              (family_id, profile_id, uppdrag_multiplier, screen_time_multiplier, daily_limit_minutes)
            values (fid, 'balans', 1.00, 1.00, 90);

            -- Redeem 15 min: cost = round(15/30 * 80 * 1.0 / 5) * 5 = 40 mynt.
            perform public.redeem_screen_time(cid, 15);

            select balance into bal from public.child_balances where child_id = cid;
            if bal <> 10 then
              raise exception 'expected balance=10 after redemption, got %', bal;
            end if;

            -- Insufficient mynt: redeeming 15 more requires 40, only 10 left.
            begin
              perform public.redeem_screen_time(cid, 15);
              raise exception 'expected insufficient-mynt to fail';
            exception when others then
              null;
            end;

            -- child_progress view: 1 approved mission today, mynt_today=50.
            declare
              p_today int;
              p_count int;
            begin
              select mynt_today, approved_missions
                into p_today, p_count
              from public.child_progress
              where child_id = cid;
              if p_today <> 50 then
                raise exception 'child_progress.mynt_today expected 50, got %', p_today;
              end if;
              if p_count <> 1 then
                raise exception 'child_progress.approved_missions expected 1, got %', p_count;
              end if;
            end;
          end $$;
          SQL

      - name: Verify RLS forced on every public table
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d growquest_test -v ON_ERROR_STOP=1 -At -c "
            select tablename
            from pg_tables
            where schemaname = 'public'
              and tablename not in (
                select c.relname
                from pg_class c
                join pg_namespace n on n.oid = c.relnamespace
                where n.nspname = 'public'
                  and c.relrowsecurity = true
                  and c.relforcerowsecurity = true
              );
          " | tee /tmp/missing_rls.txt
          if [ -s /tmp/missing_rls.txt ]; then
            echo "::error::Tables missing FORCE ROW LEVEL SECURITY:"
            cat /tmp/missing_rls.txt
            exit 1
          fi
