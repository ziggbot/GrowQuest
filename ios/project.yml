name: Growquest
options:
  bundleIdPrefix: com.growquest
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: sv
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "15.3"

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: "" # set locally; do NOT commit a real team id
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  Growquest:
    type: application
    platform: iOS
    sources:
      - path: Growquest
        excludes:
          - "**/.DS_Store"
    resources:
      - Growquest/Resources
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Growquest/Resources/Info.plist
      properties:
        CFBundleDisplayName: GrowQuest
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        # Supabase URL + anon key are injected at build via xcconfig (see ios/README.md);
        # never hard-code real values here.
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.growquest.app
        TARGETED_DEVICE_FAMILY: "1" # iPhone only for MVP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
        OTHER_SWIFT_FLAGS: -Xfrontend -warn-long-function-bodies=200 -Xfrontend -warn-long-expression-type-checking=200
    preBuildScripts:
      - name: SwiftLint
        script: |
          if which swiftlint >/dev/null; then
            swiftlint --config "$SRCROOT/.swiftlint.yml"
          else
            echo "warning: SwiftLint not installed — brew install swiftlint"
          fi
        basedOnDependencyAnalysis: false
